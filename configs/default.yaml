# SpineNet-MO default configuration (values follow the manuscript)
seed: 42
output_dir: runs/spinenet_mo

data:
  root: data/dexa                       # <root>/<class_name>/*.png|jpg  (one sub-folder per class)
  class_names: [Normal, Osteopenia, Osteoporosis]
  image_size: 224
  channels: 1
  splits_csv: data/dexa_splits.csv      # written by `prepare`
  test_size: 360                        # absolute counts reproduce 1366 / 226 / 360 for the 1,952-image dataset;
  val_size: 226                         # use fractions (e.g. 0.15) for other datasets
  roi_csv: null                         # optional: columns image,x0,y0,x1,y1 (L1-L4 region of interest)
  clinical_csv: null                    # optional: image,bmd_tscore,age,weight,fracture_history
  num_workers: 4
  augment:
    hflip: true
    rotation_deg: 15
    scale: [0.85, 1.15]

clinical_reference:                     # logistic-regression reference P_LR (objective f3)
  features: [bmd_tscore, age, weight, fracture_history]
  C: 1.0

search:
  population_size: 20                   # N_pop
  mating_pool_size: 10                  # N_mate
  generations: 25                       # G
  crossover_prob: 0.6                   # p_c
  mutation_prob: null                   # null -> 1/d
  num_blocks: 4                         # L macro-blocks per candidate
  ref_divisions: 6                      # Das-Dennis divisions (3 objectives -> 28 reference points)
  objectives: [f1, f2, f3]              # f1 = validation CE, f2 = FLOPs (G), f3 = KL (nats)
  candidate_epochs: 25                  # epochs per candidate
  candidate_batch_size: 32
  lr_min_ratio: 0.01                    # cosine floor = base_lr * ratio (base lr is a searchable gene)
  weight_decay: 5.0e-4
  selection:
    max_gflops: 2.0                     # deployment threshold on f2
    max_kl: 0.05                        # deployment threshold on f3 (nats)
  flops_counts_macs: true               # true: FLOPs = multiply-accumulates (common convention)

train:                                  # final fine-tuning of the selected architecture
  epochs: 140
  batch_size: 32
  optimizer: adamw
  lr_max: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 5.0e-4
  class_weights: auto                   # inverse-frequency weights; or a list e.g. [0.927, 1.111, 0.980]
  kl_weight: 0.1                        # weight of the KL(P_NAS || P_LR) regulariser (0 disables; used by the 'w/o KL' ablation)
  select_best_on: val_acc               # checkpoint selection criterion

evaluation:
  n_seeds: 5                            # seed-sensitivity analysis (seeds = seed, seed+1, ...)
  ci_level: 0.95
  latency_runs: 100
  latency_warmup: 10

cross_domain:
  data_root: data/knee
  splits: {val_frac: 0.15, test_frac: 0.15}   # 70 / 15 / 15
  phase1: {epochs: 30, lr: 1.0e-3}            # head only
  phase2: {epochs: 60, lr: 1.0e-4}            # all layers, cosine annealing
  weight_decay: 5.0e-4

baselines:
  pretrained: false                     # set true to start from ImageNet weights (requires download)
  epochs: 50
  lr: 1.0e-4
  models: [resnet50, vgg16, vgg16_rf, resnet50_rf, inceptionv3_rf]
  rf_trees: 300
